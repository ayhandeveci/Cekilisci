<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Anlattugbacim – Kruvasan Fular Çekilişi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#fff7ed,#fef3c7);color:#4b2e2b;overflow:hidden}
  .container{max-width:820px;margin:auto;padding:12px;position:relative;z-index:2}
  .poster{background:#fff;border-radius:26px;padding:14px;border:5px dashed #fbbf24;box-shadow:0 20px 40px rgba(0,0,0,.13)}
  h1{font-family:'Baloo 2',cursive;text-align:center;font-size:28px;margin:0}
  .subtitle{text-align:center;font-size:15px;margin:8px 0 12px}
  .section{background:#fff7ed;border-radius:18px;padding:12px;margin-bottom:10px}
  label{font-weight:800;display:block;margin-bottom:6px}
  textarea{width:100%;min-height:52px;border-radius:14px;border:2px solid #fde68a;padding:10px;font-size:14px}
  button{width:100%;margin-top:12px;padding:13px;font-size:17px;border:none;border-radius:999px;background:linear-gradient(135deg,#fb7185,#facc15);color:#4b2e2b;font-weight:900;cursor:pointer}
  button:disabled{opacity:.6}
  .result{margin-top:12px;background:#ecfeff;border-radius:18px;padding:12px;text-align:center;display:none}
  .winner{font-family:'Baloo 2',cursive;font-size:22px;margin-top:6px}

  #countdown{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:20}
  #countNum{font-family:'Baloo 2',cursive;font-size:130px;color:#fb7185;text-shadow:0 16px 50px rgba(0,0,0,.22);animation:pulse .55s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.22)}}

  canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
</style>
</head>
<body>

<canvas id="fx"></canvas>

<div class="container">
  <div class="poster">
    <h1>🧶🥐 Anlattugbacim</h1>
    <div class="subtitle">🎉 Kruvasan Fular Çekilişi 🎉</div>

    <div class="section">
      <label>❤️ Postu Beğenenler (virgülle)</label>
      <textarea id="likes" placeholder="@ali, ayse.34, caner_1907"></textarea>
    </div>
    <div class="section">
      <label>💬 Yorum Yapanlar (virgülle)</label>
      <textarea id="comments" placeholder="@ali, mehmet, ayse.34"></textarea>
    </div>
    <div class="section">
      <label>⭐ Takip Edenler (virgülle)</label>
      <textarea id="followers" placeholder="ali, ayse.34, caner_1907"></textarea>
    </div>

    <button id="btn" onclick="startDraw()">🎪 Şans Çarkını Çevir 🎪</button>

    <div class="result" id="result">
      <div>🎊 Çekiliş Sonucu 🎊</div>
      <div class="winner" id="winner"></div>
    </div>
  </div>
</div>

<div id="countdown"><div id="countNum">5</div></div>

<script>
/* ===== UTIL ===== */
function clean(text){
  return [...new Set(
    text.toLowerCase().split(",")
      .map(x=>x.trim().replace(/^@/,""))
      .filter(x=>x.length>2)
  )];
}
const R=(a,b)=>Math.random()*(b-a)+a;

/* ===== CANVAS ===== */
const canvas=document.getElementById("fx");
const ctx=canvas.getContext("2d");
let W,H, DPR=1;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize);
resize();

/* ===== PERF MODE ===== */
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const SPARKS_PER_FIREWORK = isMobile ? 120 : 170;   // düşür -> akıcı
const CONFETTI_PER_BURST  = isMobile ? 120 : 180;
const SHADOW = isMobile ? 10 : 14;

/* ===== FX STATE ===== */
let sparks=[], rings=[], confetti=[], croissants=[];
let countdownRunning=false;

/* ===== DEV KRUVA SANLAR (ön planda, dans) ===== */
function startCroissants(){
  croissants=[];
  for(let i=0;i<9;i++){
    croissants.push({
      x:R(0,W), y:R(0,H),
      r:R(80,220),
      a:R(0,Math.PI*2),
      va:R(-0.018,0.018),
      size:R(140,230),
      t:R(0,Math.PI*2),
      bob:R(18,45)
    });
  }
}
function drawCroissants(){
  ctx.save();
  for(const c of croissants){
    c.a+=c.va;
    c.t+=0.055;
    const xx = c.x + Math.cos(c.a)*c.r;
    const yy = c.y + Math.sin(c.a)*c.r + Math.sin(c.t)*c.bob;
    const s = 0.9 + 0.22*Math.sin(c.t);
    const rot = Math.sin(c.t)*0.25 + c.a*0.15;

    ctx.translate(xx,yy);
    ctx.rotate(rot);
    ctx.scale(s,s);

    ctx.shadowBlur = 18;
    ctx.shadowColor = "rgba(0,0,0,.18)";
    ctx.globalAlpha = 0.95;
    ctx.font = `${c.size}px sans-serif`;
    ctx.fillText("🥐", -c.size*0.30, c.size*0.32);

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.setTransform(DPR,0,0,DPR,0,0); // noop safeguard
    ctx.setTransform(1,0,0,1,0,0);
  }
  ctx.restore();
}

/* ===== CONFETTI (hafif ama canlı) ===== */
function burstConfetti(x,y){
  for(let i=0;i<CONFETTI_PER_BURST;i++){
    confetti.push({
      x,y,
      vx:R(-9,9),
      vy:R(-14,-2),
      g:0.38,
      s:R(3.5,8.5),
      r:R(0,Math.PI),
      vr:R(-0.22,0.22),
      life:R(70,120),
      hue:R(0,360)
    });
  }
}

/* ===== FIREWORK (akıcı + vurucu) ===== */
function firework(x,y){
  const hue=R(0,360);
  rings.push({x,y,r:0,alpha:1,hue,max:R(220,320)});
  for(let i=0;i<SPARKS_PER_FIREWORK;i++){
    const a=Math.random()*Math.PI*2;
    const sp=R(4.5,12.5);
    sparks.push({
      x,y,
      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp,
      g:0.055,
      drag:0.985,
      life:R(60,110),
      hue:(hue+R(-18,18)+360)%360
    });
  }
}

/* ===== RENDER ===== */
function tick(){
  ctx.clearRect(0,0,W,H);

  // countdown sırasında kruvasanlar
  if(countdownRunning) drawCroissants();

  // confetti
  for(const c of confetti){
    c.vy += c.g;
    c.x  += c.vx;
    c.y  += c.vy;
    c.r  += c.vr;
    c.life -= 1;

    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.rotate(c.r);
    ctx.fillStyle = `hsla(${c.hue},95%,60%,${Math.max(0,c.life/120)})`;
    ctx.fillRect(-c.s/2,-c.s/2,c.s,c.s*1.5);
    ctx.restore();
  }
  confetti = confetti.filter(c=>c.life>0 && c.y<H+60);

  // fireworks (glow without heavy cost)
  ctx.save();
  ctx.globalCompositeOperation="lighter";

  for(const r of rings){
    r.r += 10;
    r.alpha -= 0.02;
    ctx.beginPath();
    ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.lineWidth = 8;
    ctx.shadowBlur = SHADOW;
    ctx.shadowColor = `hsla(${r.hue},100%,70%,${Math.max(0,r.alpha)})`;
    ctx.strokeStyle = `hsla(${r.hue},100%,70%,${Math.max(0,r.alpha)})`;
    ctx.stroke();
  }
  rings = rings.filter(r=>r.alpha>0 && r.r<r.max);

  for(const s of sparks){
    s.vx *= s.drag;
    s.vy *= s.drag;
    s.vy += s.g;
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 1;

    const a = Math.max(0, s.life/110);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx*2.0, s.y - s.vy*2.0);
    ctx.lineWidth = 2.2;
    ctx.shadowBlur = SHADOW;
    ctx.shadowColor = `hsla(${s.hue},100%,70%,${a})`;
    ctx.strokeStyle = `hsla(${s.hue},100%,70%,${a})`;
    ctx.stroke();
  }
  sparks = sparks.filter(s=>s.life>0);

  ctx.restore();

  requestAnimationFrame(tick);
}
tick();

/* ===== FLOW ===== */
function finalShow(){
  // salvo: arka arkaya, ama hafif
  let n=0;
  const total = isMobile ? 4 : 6;
  const gap = isMobile ? 420 : 320;

  const salvo = setInterval(()=>{
    const x = R(W*0.15, W*0.85);
    const y = R(H*0.10, H*0.42);
    firework(x,y);
    if(n%2===0) burstConfetti(R(W*0.2,W*0.8), R(H*0.12,H*0.45));
    n++;
    if(n>=total) clearInterval(salvo);
  }, gap);

  // ilk patlama daha büyük hissi
  firework(W/2, H*0.22);
  firework(R(W*0.25,W*0.75), R(H*0.12,H*0.35));
  burstConfetti(W/2, H*0.28);
}

function startDraw(){
  const btn=document.getElementById("btn");
  btn.disabled=true;

  const likes=clean(likesBox.value);
  const comments=clean(commentsBox.value);
  const followers=clean(followersBox.value);
  const eligible=likes.filter(u=>comments.includes(u)&&followers.includes(u));

  startCroissants();

  const cd=document.getElementById("countdown");
  const num=document.getElementById("countNum");
  cd.style.display="flex";
  countdownRunning=true;

  let c=5;
  num.textContent=c;

  const timer=setInterval(()=>{
    c--;
    num.textContent=c;
    if(c===0){
      clearInterval(timer);
      cd.style.display="none";
      countdownRunning=false;
      croissants=[];

      finalShow();

      result.style.display="block";
      winner.textContent = eligible.length
        ? "🎉 @" + eligible[Math.floor(Math.random()*eligible.length)] + " 🎉"
        : "😢 Uygun kimse yok";

      setTimeout(()=>btn.disabled=false,1200);
    }
  },1000);
}

const likesBox=document.getElementById("likes");
const commentsBox=document.getElementById("comments");
const followersBox=document.getElementById("followers");
const result=document.getElementById("result");
const winner=document.getElementById("winner");
</script>

</body>
</html>
