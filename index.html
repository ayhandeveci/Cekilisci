<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Anlattugbacim – Kruvasan Fular Çekilişi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    background:linear-gradient(135deg,#fff7ed,#fef3c7);
    color:#4b2e2b;
    overflow:hidden;
  }
  .container{max-width:820px;margin:auto;padding:24px;position:relative;z-index:2}
  .poster{
    background:#fff;border-radius:30px;padding:26px;border:6px dashed #fbbf24;
    box-shadow:0 25px 45px rgba(0,0,0,.15);
  }
  h1{font-family:'Baloo 2',cursive;text-align:center;font-size:34px;margin:0}
  .subtitle{text-align:center;font-size:18px;margin-bottom:22px}
  .section{background:#fff7ed;border-radius:22px;padding:16px;margin-bottom:14px}
  label{font-weight:800;display:block;margin-bottom:6px}
  textarea{
    width:100%;min-height:70px;border-radius:16px;border:2px solid #fde68a;
    padding:12px;font-size:14px
  }
  button{
    width:100%;margin-top:18px;padding:16px;font-size:20px;border:none;border-radius:999px;
    background:linear-gradient(135deg,#fb7185,#facc15);color:#4b2e2b;font-weight:900;cursor:pointer
  }
  button:disabled{opacity:.6;cursor:not-allowed}
  .result{margin-top:18px;background:#ecfeff;border-radius:24px;padding:18px;text-align:center;display:none}
  .winner{font-family:'Baloo 2',cursive;font-size:28px;margin-top:8px}

  /* COUNTDOWN – şeffaf */
  #countdown{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    pointer-events:none;z-index:3;
  }
  #countNum{
    font-family:'Baloo 2',cursive;
    font-size:150px;
    color:#fb7185;
    text-shadow:0 14px 40px rgba(0,0,0,.22);
    animation:pulse .55s infinite alternate;
  }
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.22)}}

  canvas{position:fixed;inset:0;pointer-events:none;z-index:1}
  #fxTop{z-index:4}
</style>
</head>

<body>

<canvas id="fx"></canvas>
<canvas id="fxTop"></canvas>

<div class="container">
  <div class="poster">
    <h1>🧶🥐 Anlattugbacim</h1>
    <div class="subtitle">🎉 Kruvasan Fular Çekilişi 🎉</div>

    <div class="section">
      <label>❤️ Postu Beğenenler (virgülle)</label>
      <textarea id="likes" placeholder="@ali, ayse.34, caner_1907"></textarea>
    </div>
    <div class="section">
      <label>💬 Yorum Yapanlar (virgülle)</label>
      <textarea id="comments" placeholder="@ali, mehmet, ayse.34"></textarea>
    </div>
    <div class="section">
      <label>⭐ Takip Edenler (virgülle)</label>
      <textarea id="followers" placeholder="ali, ayse.34, caner_1907"></textarea>
    </div>

    <button id="btn" onclick="startDraw()">🎪 Şans Çarkını Çevir 🎪</button>

    <div class="result" id="result">
      <div>🎊 Çekiliş Sonucu 🎊</div>
      <div class="winner" id="winner"></div>
    </div>
  </div>
</div>

<div id="countdown"><div id="countNum">5</div></div>

<script>
/* ===== UTIL ===== */
function clean(text){
  return [...new Set(
    text.toLowerCase().split(",")
      .map(x=>x.trim().replace(/^@/,""))
      .filter(x=>x.length>2)
  )];
}
function rand(min,max){return Math.random()*(max-min)+min}

/* ===== CANVAS SETUP ===== */
const fx = document.getElementById("fx");
const ctx = fx.getContext("2d");
const fxTop = document.getElementById("fxTop");
const ctxTop = fxTop.getContext("2d");

let W,H;
function resize(){
  W=fx.width=fxTop.width=window.innerWidth;
  H=fx.height=fxTop.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

/* ===== STATE ===== */
let confetti=[], rings=[], sparks=[], ribbons=[], croissants=[];
let tension = 0;
let countdownRunning=false;
let salvoTimer=null;

/* ===== BIG DANCING CROISSANTS (🥐) ===== */
function startCroissants(){
  croissants = [];
  const n = 10; // more croissants
  for(let i=0;i<n;i++){
    croissants.push({
      cx: rand(W*0.15,W*0.85),
      cy: rand(H*0.18,H*0.78),
      r: rand(40,140),
      a: rand(0,Math.PI*2),
      va: rand(0.01,0.03) * (Math.random()<0.5?-1:1),
      bob: rand(10,28),
      t: rand(0,Math.PI*2),
      // BIG sizes
      size: rand(60,115),
      spin: rand(-0.06,0.06),
      scT: rand(0,Math.PI*2),
    });
  }
}
function drawCroissants(){
  ctx.save();
  for(const c of croissants){
    // speed increases with tension
    c.a += c.va * (1 + tension*2.4);
    c.t += 0.06 * (1 + tension*1.6);
    c.scT += 0.08;
    const x = c.cx + Math.cos(c.a)*c.r;
    const y = c.cy + Math.sin(c.a)*c.r + Math.sin(c.t)*c.bob;

    const scale = 0.95 + 0.18*Math.sin(c.scT); // dance (breathing)
    const rot = (c.a*0.6) + Math.sin(c.t)*0.35 + c.spin*tension*8;

    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.scale(scale, scale);
    ctx.font = `${c.size}px sans-serif`;
    ctx.globalAlpha = 0.92;
    ctx.fillText("🥐", -c.size*0.28, c.size*0.32);
    ctx.setTransform(1,0,0,1,0,0);
  }
  ctx.restore();
}

/* ===== RIBBONS (fular vibe) ===== */
function startRibbons(){
  ribbons = [];
  const n = 6;
  for(let i=0;i<n;i++){
    ribbons.push({
      x: rand(W*0.1,W*0.9),
      y: rand(H*0.18,H*0.85),
      amp: rand(20,55),
      len: rand(240,420),
      w: rand(7,12),
      phase: rand(0,Math.PI*2),
      speed: rand(0.03,0.07) * (Math.random()<0.5?-1:1),
      hue: rand(0,360)
    });
  }
}
function drawRibbons(){
  for(const r of ribbons){
    r.phase += r.speed * (1 + tension*2.6);
    ctxTop.save();
    ctxTop.lineWidth = r.w;
    ctxTop.lineCap = "round";
    const grad = ctxTop.createLinearGradient(r.x, r.y, r.x+r.len, r.y);
    grad.addColorStop(0, `hsla(${(r.hue+0)%360}, 95%, 65%, .85)`);
    grad.addColorStop(0.5, `hsla(${(r.hue+45)%360}, 95%, 62%, .85)`);
    grad.addColorStop(1, `hsla(${(r.hue+90)%360}, 95%, 60%, .85)`);
    ctxTop.strokeStyle = grad;

    ctxTop.beginPath();
    const steps = 26;
    for(let i=0;i<=steps;i++){
      const t = i/steps;
      const xx = r.x + t*r.len;
      const yy = r.y + Math.sin(r.phase + t*7.2) * r.amp * (1 + tension*1.8);
      if(i===0) ctxTop.moveTo(xx,yy);
      else ctxTop.lineTo(xx,yy);
    }
    ctxTop.stroke();

    // shimmer
    ctxTop.globalCompositeOperation="lighter";
    for(let i=0;i<7;i++){
      const t = i/7;
      const xx = r.x + t*r.len;
      const yy = r.y + Math.sin(r.phase + t*7.2) * r.amp * (1 + tension*1.8);
      ctxTop.fillStyle = `rgba(255,255,255,${0.18 + 0.35*Math.sin(r.phase+i)})`;
      ctxTop.beginPath();
      ctxTop.arc(xx,yy,2.4,0,Math.PI*2);
      ctxTop.fill();
    }
    ctxTop.globalCompositeOperation="source-over";
    ctxTop.restore();
  }
}

/* ===== CONFETTI ===== */
function launchConfetti(burstX, burstY, amount=320){
  for(let i=0;i<amount;i++){
    confetti.push({
      x: burstX, y: burstY,
      vx: rand(-11,11),
      vy: rand(-16,-3),
      g: 0.38,
      size: rand(4,10),
      rot: rand(0,Math.PI),
      vr: rand(-0.25,0.25),
      life: rand(90,160),
      hue: rand(0,360)
    });
  }
}

/* ===== BIG, BRIGHT, COLORFUL FIREWORKS ===== */
function launchFireworkBig(){
  const x = rand(W*0.12, W*0.88);
  const y = rand(H*0.10, H*0.42);
  const hue = rand(0,360);

  // shock rings (bigger + brighter)
  rings.push({x,y,r:0, max: rand(220,340), hue, alpha:1});
  rings.push({x,y,r:0, max: rand(180,280), hue:(hue+40)%360, alpha:0.85});

  // lots of sparks
  const n = 220;
  for(let i=0;i<n;i++){
    const a = (Math.PI*2) * (i/n) + rand(-0.05,0.05);
    const sp = rand(4.5, 13.0);
    sparks.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      g: 0.06,
      drag: 0.985,
      life: rand(70,140),
      hue: (hue + rand(-20,20) + 360) % 360,
      w: rand(1.6,3.2),
      alpha: 1
    });
  }
}

function drawFireworks(){
  // additive glow
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  // rings with blur glow
  for(const f of rings){
    f.r += 10;
    f.alpha -= 0.014;
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.strokeStyle = `hsla(${f.hue}, 100%, 70%, ${Math.max(0,f.alpha)})`;
    ctx.lineWidth = 8;
    ctx.shadowBlur = 18;
    ctx.shadowColor = `hsla(${f.hue}, 100%, 70%, ${Math.max(0,f.alpha)})`;
    ctx.stroke();
  }
  rings = rings.filter(f=>f.alpha>0 && f.r<f.max);

  // sparks
  for(const s of sparks){
    s.vx *= s.drag;
    s.vy *= s.drag;
    s.vy += s.g;
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 1;
    s.alpha = Math.max(0, s.life/140);

    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx*1.9, s.y - s.vy*1.9);
    ctx.strokeStyle = `hsla(${s.hue}, 100%, 70%, ${s.alpha})`;
    ctx.lineWidth = s.w;
    ctx.shadowBlur = 16;
    ctx.shadowColor = `hsla(${s.hue}, 100%, 70%, ${s.alpha})`;
    ctx.stroke();

    // hot core
    ctx.fillStyle = `hsla(${(s.hue+10)%360}, 100%, 82%, ${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 1.9, 0, Math.PI*2);
    ctx.fill();
  }
  sparks = sparks.filter(s=>s.life>0);

  ctx.restore();
}

/* ===== LOOP ===== */
function animate(){
  ctx.clearRect(0,0,W,H);
  ctxTop.clearRect(0,0,W,H);

  // tension ramps during countdown
  if(countdownRunning) tension = Math.min(1, tension + 0.02);
  else tension = Math.max(0, tension - 0.04);

  // confetti physics
  for(const p of confetti){
    p.vy += p.g;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life -= 1;

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = `hsla(${p.hue}, 95%, 60%, ${Math.max(0,p.life/160)})`;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.5);
    ctx.restore();
  }
  confetti = confetti.filter(p=>p.life>0 && p.y < H+80);

  // countdown vibes
  if(countdownRunning){
    drawCroissants();
    drawRibbons();
  }

  // fireworks always draw (final only spawns them)
  drawFireworks();

  requestAnimationFrame(animate);
}
animate();

/* ===== FLOW HELPERS ===== */
function clearAllFx(){
  confetti=[]; rings=[]; sparks=[]; ribbons=[]; croissants=[];
  if(salvoTimer){ clearInterval(salvoTimer); salvoTimer=null; }
}

function finalSalvos(){
  // Arka arkaya “salvo” patlamaları: 5 kez
  let shots = 0;
  const total = 5;        // kaç sefer
  const gapMs = 380;      // aralık

  // ilk anda biraz daha güçlü başla
  launchFireworkBig(); launchFireworkBig();
  launchConfetti(W/2, H*0.28, 520);

  salvoTimer = setInterval(()=>{
    shots++;
    // her salvo: 2 büyük fişek
    launchFireworkBig();
    launchFireworkBig();
    // küçük konfeti burstleri
    launchConfetti(rand(W*0.2,W*0.8), rand(H*0.12,H*0.45), 220);

    if(shots >= total){
      clearInterval(salvoTimer);
      salvoTimer=null;
    }
  }, gapMs);
}

/* ===== DRAW FLOW ===== */
function startDraw(){
  const btn = document.getElementById("btn");
  btn.disabled = true;

  const likes=clean(likesBox.value);
  const comments=clean(commentsBox.value);
  const followers=clean(followersBox.value);
  const eligible=likes.filter(u=>comments.includes(u)&&followers.includes(u));

  clearAllFx();
  startCroissants();
  startRibbons();

  const cd=document.getElementById("countdown");
  const num=document.getElementById("countNum");
  cd.style.display="flex";

  countdownRunning = true;
  let c=5;
  num.textContent=c;

  const timer=setInterval(()=>{
    c--;
    num.textContent=c;

    if(c===0){
      clearInterval(timer);
      cd.style.display="none";
      countdownRunning = false;

      finalSalvos();

      result.style.display="block";
      winner.textContent = eligible.length
        ? "🎉 @" + eligible[Math.floor(Math.random()*eligible.length)] + " 🎉"
        : "😢 Uygun kimse yok";

      setTimeout(()=>{ btn.disabled = false; }, 1500);
    }
  },1000);
}

const likesBox=document.getElementById("likes");
const commentsBox=document.getElementById("comments");
const followersBox=document.getElementById("followers");
const result=document.getElementById("result");
const winner=document.getElementById("winner");
</script>

</body>
</html>
