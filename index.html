<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Anlattugbacim – Kruvasan Fular Çekilişi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    background:linear-gradient(135deg,#fff7ed,#fef3c7);
    color:#4b2e2b;
    overflow:hidden;
  }
  .container{max-width:820px;margin:auto;padding:24px;position:relative;z-index:2}
  .poster{
    background:#fff;border-radius:30px;padding:26px;border:6px dashed #fbbf24;
    box-shadow:0 25px 45px rgba(0,0,0,.15);
  }
  h1{font-family:'Baloo 2',cursive;text-align:center;font-size:34px;margin:0}
  .subtitle{text-align:center;font-size:18px;margin-bottom:22px}
  .section{background:#fff7ed;border-radius:22px;padding:16px;margin-bottom:14px}
  label{font-weight:800;display:block;margin-bottom:6px}
  textarea{
    width:100%;min-height:70px;border-radius:16px;border:2px solid #fde68a;
    padding:12px;font-size:14px
  }
  button{
    width:100%;margin-top:18px;padding:16px;font-size:20px;border:none;border-radius:999px;
    background:linear-gradient(135deg,#fb7185,#facc15);color:#4b2e2b;font-weight:900;cursor:pointer
  }
  button:disabled{opacity:.6;cursor:not-allowed}
  .result{margin-top:18px;background:#ecfeff;border-radius:24px;padding:18px;text-align:center;display:none}
  .winner{font-family:'Baloo 2',cursive;font-size:28px;margin-top:8px}

  /* COUNTDOWN – şeffaf */
  #countdown{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    pointer-events:none;z-index:3;
  }
  #countNum{
    font-family:'Baloo 2',cursive;
    font-size:150px;
    color:#fb7185;
    text-shadow:0 14px 40px rgba(0,0,0,.22);
    animation:pulse .55s infinite alternate;
  }
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.22)}}

  canvas{position:fixed;inset:0;pointer-events:none;z-index:1}
  #fxTop{z-index:4}
</style>
</head>

<body>

<canvas id="fx"></canvas>
<canvas id="fxTop"></canvas>

<div class="container">
  <div class="poster">
    <h1>🧶🥐 Anlattugbacim</h1>
    <div class="subtitle">🎉 Kruvasan Fular Çekilişi 🎉</div>

    <div class="section">
      <label>❤️ Postu Beğenenler (virgülle)</label>
      <textarea id="likes" placeholder="@ali, ayse.34, caner_1907"></textarea>
    </div>
    <div class="section">
      <label>💬 Yorum Yapanlar (virgülle)</label>
      <textarea id="comments" placeholder="@ali, mehmet, ayse.34"></textarea>
    </div>
    <div class="section">
      <label>⭐ Takip Edenler (virgülle)</label>
      <textarea id="followers" placeholder="ali, ayse.34, caner_1907"></textarea>
    </div>

    <button id="btn" onclick="startDraw()">🎪 Şans Çarkını Çevir 🎪</button>

    <div class="result" id="result">
      <div>🎊 Çekiliş Sonucu 🎊</div>
      <div class="winner" id="winner"></div>
    </div>
  </div>
</div>

<div id="countdown"><div id="countNum">5</div></div>

<script>
/* ===== UTIL ===== */
function clean(text){
  return [...new Set(
    text.toLowerCase().split(",")
      .map(x=>x.trim().replace(/^@/,""))
      .filter(x=>x.length>2)
  )];
}
function rand(min,max){return Math.random()*(max-min)+min}

/* ===== CANVAS SETUP ===== */
const fx = document.getElementById("fx");
const ctx = fx.getContext("2d");
const fxTop = document.getElementById("fxTop");
const ctxTop = fxTop.getContext("2d");

let W,H;
function resize(){
  W=fx.width=fxTop.width=window.innerWidth;
  H=fx.height=fxTop.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

/* ===== STATE ===== */
let confetti=[], fireworks=[], sparks=[], ribbons=[], croissants=[];
let tension = 0;          // 0..1
let countdownRunning=false;

/* ===== CROISSANTS (🥐) — orbit/bounce during countdown ===== */
function startCroissants(){
  croissants = [];
  const n = 7;
  for(let i=0;i<n;i++){
    croissants.push({
      cx: rand(W*0.2,W*0.8),
      cy: rand(H*0.25,H*0.7),
      r: rand(30,90),
      a: rand(0,Math.PI*2),
      va: rand(0.01,0.03) * (Math.random()<0.5?-1:1),
      bob: rand(6,18),
      t: rand(0,Math.PI*2),
      size: rand(26,46)
    });
  }
}
function drawCroissants(){
  ctx.save();
  ctx.font = "32px sans-serif";
  for(const c of croissants){
    c.a += c.va * (1 + tension*1.8);
    c.t += 0.05;
    const x = c.cx + Math.cos(c.a)*c.r;
    const y = c.cy + Math.sin(c.a)*c.r + Math.sin(c.t)*c.bob;
    ctx.font = `${c.size}px sans-serif`;
    ctx.globalAlpha = 0.9;
    ctx.fillText("🥐", x, y);
  }
  ctx.restore();
}

/* ===== RIBBONS (fular vibe) ===== */
function startRibbons(){
  ribbons = [];
  const n = 5;
  for(let i=0;i<n;i++){
    ribbons.push({
      x: rand(W*0.1,W*0.9),
      y: rand(H*0.2,H*0.8),
      amp: rand(18,40),
      len: rand(220,360),
      w: rand(6,10),
      phase: rand(0,Math.PI*2),
      speed: rand(0.03,0.06) * (Math.random()<0.5?-1:1),
      hue: rand(320,30) // wrap-ish, we'll handle with hsl
    });
  }
}
function drawRibbons(){
  for(const r of ribbons){
    r.phase += r.speed * (1 + tension*2.2);
    ctxTop.save();
    ctxTop.lineWidth = r.w;
    ctxTop.lineCap = "round";
    // colorful scarf-ish gradient
    const grad = ctxTop.createLinearGradient(r.x, r.y, r.x+r.len, r.y);
    grad.addColorStop(0, `hsla(${(r.hue+0)%360}, 95%, 65%, .85)`);
    grad.addColorStop(0.5, `hsla(${(r.hue+45)%360}, 95%, 62%, .85)`);
    grad.addColorStop(1, `hsla(${(r.hue+90)%360}, 95%, 60%, .85)`);
    ctxTop.strokeStyle = grad;

    ctxTop.beginPath();
    const steps = 22;
    for(let i=0;i<=steps;i++){
      const t = i/steps;
      const xx = r.x + t*r.len;
      const yy = r.y + Math.sin(r.phase + t*6.5) * r.amp * (1 + tension*1.6);
      if(i===0) ctxTop.moveTo(xx,yy);
      else ctxTop.lineTo(xx,yy);
    }
    ctxTop.stroke();

    // little shimmer dots along ribbon
    ctxTop.globalCompositeOperation="lighter";
    for(let i=0;i<6;i++){
      const t = (i/6);
      const xx = r.x + t*r.len;
      const yy = r.y + Math.sin(r.phase + t*6.5) * r.amp * (1 + tension*1.6);
      ctxTop.fillStyle = `rgba(255,255,255,${0.25 + 0.25*Math.sin(r.phase+i)})`;
      ctxTop.beginPath();
      ctxTop.arc(xx,yy,2.2,0,Math.PI*2);
      ctxTop.fill();
    }
    ctxTop.restore();
  }
}

/* ===== CONFETTI ===== */
function launchConfetti(burstX, burstY, amount=260){
  for(let i=0;i<amount;i++){
    confetti.push({
      x: burstX, y: burstY,
      vx: rand(-10,10),
      vy: rand(-14,-2),
      g: 0.35,
      size: rand(4,9),
      rot: rand(0,Math.PI),
      vr: rand(-0.25,0.25),
      life: rand(90,150),
      hue: rand(0,360)
    });
  }
}

/* ===== FIREWORKS (big, bright, colorful, punchy) ===== */
function launchFirework(){
  const x = rand(W*0.15, W*0.85);
  const y = rand(H*0.12, H*0.45);
  const hue = rand(0,360);
  const n = 140; // more sparks
  for(let i=0;i<n;i++){
    const a = (Math.PI*2) * (i/n) + rand(-0.03,0.03);
    const sp = rand(3.5,9.5);
    sparks.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      g: 0.06,
      life: rand(60,110),
      hue,
      w: rand(1.2,2.6),
      alpha: 1
    });
  }
  // shockwave ring
  fireworks.push({x,y,r:0, max: rand(140,220), hue, alpha:1});
}

function drawFireworks(){
  // glow mode
  ctx.globalCompositeOperation = "lighter";

  // shockwave rings
  for(const f of fireworks){
    f.r += 8;
    f.alpha -= 0.018;
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.strokeStyle = `hsla(${f.hue}, 95%, 70%, ${Math.max(0,f.alpha)})`;
    ctx.lineWidth = 6;
    ctx.stroke();
  }
  fireworks = fireworks.filter(f=>f.alpha>0 && f.r<f.max);

  // sparks
  for(const s of sparks){
    s.vy += s.g;
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 1;
    s.alpha = Math.max(0, s.life/110);

    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx*1.6, s.y - s.vy*1.6);
    ctx.strokeStyle = `hsla(${s.hue}, 100%, 70%, ${s.alpha})`;
    ctx.lineWidth = s.w;
    ctx.stroke();

    // bright core dot
    ctx.fillStyle = `hsla(${(s.hue+20)%360}, 100%, 80%, ${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 1.6, 0, Math.PI*2);
    ctx.fill();
  }
  sparks = sparks.filter(s=>s.life>0);

  ctx.globalCompositeOperation = "source-over";
}

/* ===== DRAW LOOP ===== */
function animate(){
  ctx.clearRect(0,0,W,H);
  ctxTop.clearRect(0,0,W,H);

  if(countdownRunning){
    // “tansiyon” hissi: hafif global wave/rumble
    tension = Math.min(1, tension + 0.015);
  }else{
    tension = Math.max(0, tension - 0.03);
  }

  // Confetti physics
  for(const p of confetti){
    p.vy += p.g;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life -= 1;

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = `hsla(${p.hue}, 95%, 60%, ${Math.max(0,p.life/150)})`;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.4);
    ctx.restore();
  }
  confetti = confetti.filter(p=>p.life>0 && p.y < H+60);

  // Countdown vibe
  if(countdownRunning){
    drawCroissants();
    drawRibbons();
  }

  // Big fireworks
  drawFireworks();

  requestAnimationFrame(animate);
}
animate();

/* ===== FLOW ===== */
function clearCountdownVibes(){
  confetti = []; fireworks = []; sparks = [];
  ribbons = []; croissants = [];
}

function finalBoom(){
  // multiple large fireworks + mega confetti
  for(let i=0;i<9;i++) launchFirework();
  launchConfetti(W/2, H*0.28, 420);
  // extra bursts around screen
  for(let i=0;i<3;i++){
    launchConfetti(rand(W*0.2,W*0.8), rand(H*0.15,H*0.45), 200);
  }
}

function startDraw(){
  const btn = document.getElementById("btn");
  btn.disabled = true;

  const likes=clean(likesBox.value);
  const comments=clean(commentsBox.value);
  const followers=clean(followersBox.value);
  const eligible=likes.filter(u=>comments.includes(u)&&followers.includes(u));

  // start vibes
  clearCountdownVibes();
  startCroissants();
  startRibbons();

  const cd=document.getElementById("countdown");
  const num=document.getElementById("countNum");
  cd.style.display="flex";

  countdownRunning = true;
  let c=5;
  num.textContent=c;

  const timer=setInterval(()=>{
    c--;
    num.textContent=c;

    // ramp up tension
    // (croissants/ribbons already speed up via "tension")

    if(c===0){
      clearInterval(timer);
      cd.style.display="none";
      countdownRunning = false;

      // FINAL FX
      finalBoom();

      result.style.display="block";
      winner.textContent = eligible.length
        ? "🎉 @" + eligible[Math.floor(Math.random()*eligible.length)] + " 🎉"
        : "😢 Uygun kimse yok";

      setTimeout(()=>{ btn.disabled = false; }, 1300);
    }
  },1000);
}

const likesBox=document.getElementById("likes");
const commentsBox=document.getElementById("comments");
const followersBox=document.getElementById("followers");
const result=document.getElementById("result");
const winner=document.getElementById("winner");
</script>

</body>
</html>
