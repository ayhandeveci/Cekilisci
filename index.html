<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Anlattugbacim – Kruvasan Fular Çekilişi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#fff7ed,#fef3c7);
  color:#4b2e2b;
  overflow:hidden;
}
.container{
  max-width:820px;
  margin:auto;
  padding:24px;
}
.poster{
  background:#fff;
  border-radius:30px;
  padding:26px;
  border:6px dashed #fbbf24;
  box-shadow:0 25px 45px rgba(0,0,0,.15);
}
h1{
  font-family:'Baloo 2',cursive;
  text-align:center;
  font-size:34px;
  margin:0;
}
.subtitle{
  text-align:center;
  font-size:18px;
  margin-bottom:22px;
}
.section{
  background:#fff7ed;
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
}
label{font-weight:800;display:block;margin-bottom:6px}
textarea{
  width:100%;min-height:70px;border-radius:16px;
  border:2px solid #fde68a;padding:12px;font-size:14px
}
button{
  width:100%;margin-top:18px;padding:16px;font-size:20px;
  border:none;border-radius:999px;
  background:linear-gradient(135deg,#fb7185,#facc15);
  color:#4b2e2b;font-weight:900;cursor:pointer
}
.result{
  margin-top:18px;background:#ecfeff;border-radius:24px;
  padding:18px;text-align:center;display:none
}
.winner{
  font-family:'Baloo 2',cursive;font-size:28px;margin-top:8px
}

/* COUNTDOWN – şeffaf */
#countdown{
  position:fixed;inset:0;display:none;
  align-items:center;justify-content:center;
  pointer-events:none;z-index:10
}
#countNum{
  font-family:'Baloo 2',cursive;
  font-size:140px;color:#fb7185;
  text-shadow:0 10px 30px rgba(0,0,0,.2);
  animation:pulse .6s infinite alternate
}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.2)}}

/* CANVAS */
canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5;
}
</style>
</head>

<body>

<canvas id="fx"></canvas>

<div class="container">
  <div class="poster">
    <h1>🧶🥐 Anlattugbacim</h1>
    <div class="subtitle">🎉 Kruvasan Fular Çekilişi 🎉</div>

    <div class="section">
      <label>❤️ Postu Beğenenler</label>
      <textarea id="likes"></textarea>
    </div>
    <div class="section">
      <label>💬 Yorum Yapanlar</label>
      <textarea id="comments"></textarea>
    </div>
    <div class="section">
      <label>⭐ Hesabı Takip Edenler</label>
      <textarea id="followers"></textarea>
    </div>

    <button onclick="startDraw()">🎪 Şans Çarkını Çevir 🎪</button>

    <div class="result" id="result">
      <div>🎊 Çekiliş Sonucu 🎊</div>
      <div class="winner" id="winner"></div>
    </div>
  </div>
</div>

<div id="countdown"><div id="countNum">5</div></div>

<script>
/* ====== UTIL ====== */
function clean(text){
  return [...new Set(
    text.toLowerCase().split(",")
      .map(x=>x.trim().replace(/^@/,""))
      .filter(x=>x.length>2)
  )];
}

/* ====== CANVAS FX ====== */
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
let W,H,particles=[],fireworks=[];
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

function rand(min,max){return Math.random()*(max-min)+min}

/* CONFETTI */
function launchConfetti(){
  for(let i=0;i<200;i++){
    particles.push({
      x:W/2,y:H/3,
      vx:rand(-8,8),
      vy:rand(-12,-2),
      g:0.3,
      size:rand(4,8),
      rot:rand(0,Math.PI),
      vr:rand(-0.2,0.2),
      color:["#fb7185","#facc15","#38bdf8","#4ade80","#a78bfa"]
        [Math.floor(Math.random()*5)]
    });
  }
}

/* FIREWORK */
function launchFirework(){
  fireworks.push({
    x:rand(W*0.2,W*0.8),
    y:rand(H*0.2,H*0.5),
    r:0,
    max:rand(30,50),
    alpha:1
  });
}

function animate(){
  ctx.clearRect(0,0,W,H);

  particles.forEach(p=>{
    p.vy+=p.g;
    p.x+=p.vx;
    p.y+=p.vy;
    p.rot+=p.vr;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle=p.color;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    ctx.restore();
  });
  particles=particles.filter(p=>p.y<H+20);

  fireworks.forEach(f=>{
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,200,0,${f.alpha})`;
    ctx.lineWidth=4;
    ctx.stroke();
    f.r+=2;
    f.alpha-=0.03;
  });
  fireworks=fireworks.filter(f=>f.alpha>0);

  requestAnimationFrame(animate);
}
animate();

/* ====== DRAW FLOW ====== */
function startDraw(){
  const likes=clean(likesBox.value);
  const comments=clean(commentsBox.value);
  const followers=clean(followersBox.value);
  const eligible=likes.filter(u=>comments.includes(u)&&followers.includes(u));

  const cd=document.getElementById("countdown");
  const num=document.getElementById("countNum");
  cd.style.display="flex";

  let c=5;
  num.textContent=c;

  const timer=setInterval(()=>{
    c--;
    num.textContent=c;
    if(c===0){
      clearInterval(timer);
      cd.style.display="none";

      // FINAL FX
      for(let i=0;i<6;i++) launchFirework();
      launchConfetti();

      result.style.display="block";
      winner.textContent = eligible.length
        ? "🎉 @" + eligible[Math.floor(Math.random()*eligible.length)] + " 🎉"
        : "😢 Uygun kimse yok";
    }
  },1000);
}

const likesBox=document.getElementById("likes");
const commentsBox=document.getElementById("comments");
const followersBox=document.getElementById("followers");
const result=document.getElementById("result");
const winner=document.getElementById("winner");
</script>

</body>
</html>
