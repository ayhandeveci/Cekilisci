<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Anlattugbacim – Kruvasan Fular Çekilişi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    background:linear-gradient(135deg,#fff7ed,#fef3c7);
    color:#4b2e2b;
    overflow:hidden;
  }

  /* UI */
  .container{max-width:820px;margin:auto;padding:24px;position:relative;z-index:2}
  .poster{
    background:#fff;border-radius:30px;padding:26px;border:6px dashed #fbbf24;
    box-shadow:0 25px 45px rgba(0,0,0,.15);
  }
  h1{font-family:'Baloo 2',cursive;text-align:center;font-size:34px;margin:0}
  .subtitle{text-align:center;font-size:18px;margin-bottom:22px}
  .section{background:#fff7ed;border-radius:22px;padding:16px;margin-bottom:14px}
  label{font-weight:800;display:block;margin-bottom:6px}
  textarea{
    width:100%;min-height:70px;border-radius:16px;border:2px solid #fde68a;
    padding:12px;font-size:14px
  }
  button{
    width:100%;margin-top:18px;padding:16px;font-size:20px;border:none;border-radius:999px;
    background:linear-gradient(135deg,#fb7185,#facc15);color:#4b2e2b;font-weight:900;cursor:pointer
  }
  button:disabled{opacity:.6;cursor:not-allowed}
  .result{margin-top:18px;background:#ecfeff;border-radius:24px;padding:18px;text-align:center;display:none}
  .winner{font-family:'Baloo 2',cursive;font-size:28px;margin-top:8px}

  /* COUNTDOWN – şeffaf, sayı en üstte */
  #countdown{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    pointer-events:none;z-index:20;
  }
  #countNum{
    font-family:'Baloo 2',cursive;
    font-size:160px;
    color:#fb7185;
    text-shadow:0 16px 50px rgba(0,0,0,.22);
    animation:pulse .55s infinite alternate;
  }
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.22)}}

  /* CANVAS LAYERS */
  canvas{position:fixed;inset:0;pointer-events:none}
  #fxBack{z-index:1}  /* fireworks/confetti */
  #fxFront{z-index:10} /* DEV KRUVA SAN + fular ribbon panel üstünde */
</style>
</head>

<body>

<canvas id="fxBack"></canvas>
<canvas id="fxFront"></canvas>

<div class="container">
  <div class="poster">
    <h1>🧶🥐 Anlattugbacim</h1>
    <div class="subtitle">🎉 Kruvasan Fular Çekilişi 🎉</div>

    <div class="section">
      <label>❤️ Postu Beğenenler (virgülle)</label>
      <textarea id="likes" placeholder="@ali, ayse.34, caner_1907"></textarea>
    </div>
    <div class="section">
      <label>💬 Yorum Yapanlar (virgülle)</label>
      <textarea id="comments" placeholder="@ali, mehmet, ayse.34"></textarea>
    </div>
    <div class="section">
      <label>⭐ Takip Edenler (virgülle)</label>
      <textarea id="followers" placeholder="ali, ayse.34, caner_1907"></textarea>
    </div>

    <button id="btn" onclick="startDraw()">🎪 Şans Çarkını Çevir 🎪</button>

    <div class="result" id="result">
      <div>🎊 Çekiliş Sonucu 🎊</div>
      <div class="winner" id="winner"></div>
    </div>
  </div>
</div>

<div id="countdown"><div id="countNum">5</div></div>

<script>
/* ===== UTIL ===== */
function clean(text){
  return [...new Set(
    text.toLowerCase().split(",")
      .map(x=>x.trim().replace(/^@/,""))
      .filter(x=>x.length>2)
  )];
}
function rand(min,max){return Math.random()*(max-min)+min}

/* ===== CANVAS SETUP ===== */
const back = document.getElementById("fxBack");
const b = back.getContext("2d");
const front = document.getElementById("fxFront");
const f = front.getContext("2d");

let W,H;
function resize(){
  W=back.width=front.width=window.innerWidth;
  H=back.height=front.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

/* ===== STATE ===== */
let confetti=[], rings=[], sparks=[];
let ribbons=[], croissants=[];
let tension=0;
let countdownRunning=false;
let salvoTimer=null;

/* ===== DEV KRUVA SANLAR (ÖN PLAN) ===== */
function startCroissants(){
  croissants = [];
  const n = 14; // daha fazla kruvasan
  for(let i=0;i<n;i++){
    croissants.push({
      // panelin üstünde de gezsin: tüm ekran
      cx: rand(W*0.05,W*0.95),
      cy: rand(H*0.05,H*0.95),
      r: rand(60,220),
      a: rand(0,Math.PI*2),
      va: rand(0.008,0.02) * (Math.random()<0.5?-1:1),
      bob: rand(18,42),
      t: rand(0,Math.PI*2),
      // DEV BOYUT
      size: rand(130,220),
      scT: rand(0,Math.PI*2),
      driftX: rand(-0.35,0.35),
      driftY: rand(-0.25,0.25)
    });
  }
}

function drawCroissantsFront(){
  // kruvasanlar panelin üstünde: front canvas
  f.save();
  for(const c of croissants){
    // drift + orbit + dans
    c.a += c.va * (1 + tension*2.8);
    c.t += 0.05 * (1 + tension*1.8);
    c.scT += 0.08;

    c.cx += c.driftX * (1 + tension*0.6);
    c.cy += c.driftY * (1 + tension*0.6);

    // ekrandan taşarsa geri sok
    if(c.cx < -100) c.cx = W+100;
    if(c.cx > W+100) c.cx = -100;
    if(c.cy < -100) c.cy = H+100;
    if(c.cy > H+100) c.cy = -100;

    const x = c.cx + Math.cos(c.a)*c.r;
    const y = c.cy + Math.sin(c.a)*c.r + Math.sin(c.t)*c.bob;

    const scale = 0.92 + 0.22*Math.sin(c.scT); // dance
    const rot = (Math.sin(c.t)*0.35) + (c.a*0.3); // twirl

    f.translate(x,y);
    f.rotate(rot);
    f.scale(scale, scale);

    // shadow/glow — daha “ön planda” hissi
    f.shadowBlur = 22;
    f.shadowColor = "rgba(0,0,0,.18)";
    f.globalAlpha = 0.95;
    f.font = `${c.size}px sans-serif`;
    f.fillText("🥐", -c.size*0.30, c.size*0.32);

    f.setTransform(1,0,0,1,0,0);
  }
  f.restore();
}

/* ===== FULAR (RIBBON) — ÖN PLANDA ===== */
function startRibbons(){
  ribbons = [];
  const n = 6;
  for(let i=0;i<n;i++){
    ribbons.push({
      x: rand(W*0.05,W*0.85),
      y: rand(H*0.10,H*0.90),
      amp: rand(22,60),
      len: rand(260,520),
      w: rand(8,14),
      phase: rand(0,Math.PI*2),
      speed: rand(0.03,0.07) * (Math.random()<0.5?-1:1),
      hue: rand(0,360)
    });
  }
}
function drawRibbonsFront(){
  for(const r of ribbons){
    r.phase += r.speed * (1 + tension*2.8);

    f.save();
    f.lineWidth = r.w;
    f.lineCap = "round";

    const grad = f.createLinearGradient(r.x, r.y, r.x+r.len, r.y);
    grad.addColorStop(0, `hsla(${(r.hue+0)%360}, 95%, 65%, .80)`);
    grad.addColorStop(0.5, `hsla(${(r.hue+45)%360}, 95%, 62%, .80)`);
    grad.addColorStop(1, `hsla(${(r.hue+90)%360}, 95%, 60%, .80)`);
    f.strokeStyle = grad;

    f.beginPath();
    const steps = 28;
    for(let i=0;i<=steps;i++){
      const t = i/steps;
      const xx = r.x + t*r.len;
      const yy = r.y + Math.sin(r.phase + t*7.4) * r.amp * (1 + tension*1.9);
      if(i===0) f.moveTo(xx,yy); else f.lineTo(xx,yy);
    }

    f.shadowBlur = 14;
    f.shadowColor = "rgba(0,0,0,.10)";
    f.stroke();

    // shimmer
    f.globalCompositeOperation="lighter";
    for(let i=0;i<7;i++){
      const t = i/7;
      const xx = r.x + t*r.len;
      const yy = r.y + Math.sin(r.phase + t*7.4) * r.amp * (1 + tension*1.9);
      f.fillStyle = `rgba(255,255,255,${0.14 + 0.30*Math.sin(r.phase+i)})`;
      f.beginPath(); f.arc(xx,yy,2.6,0,Math.PI*2); f.fill();
    }

    f.restore();
  }
}

/* ===== CONFETTI ===== */
function launchConfetti(burstX, burstY, amount=340){
  for(let i=0;i<amount;i++){
    confetti.push({
      x: burstX, y: burstY,
      vx: rand(-12,12),
      vy: rand(-18,-3),
      g: 0.40,
      size: rand(4,11),
      rot: rand(0,Math.PI),
      vr: rand(-0.28,0.28),
      life: rand(90,170),
      hue: rand(0,360)
    });
  }
}

/* ===== DEV, PARLAK, RENKLİ FİŞEK ===== */
function launchFireworkBig(){
  const x = rand(W*0.10, W*0.90);
  const y = rand(H*0.08, H*0.45);
  const hue = rand(0,360);

  rings.push({x,y,r:0, max: rand(260,420), hue, alpha:1});
  rings.push({x,y,r:0, max: rand(220,360), hue:(hue+50)%360, alpha:0.85});

  const n = 260;
  for(let i=0;i<n;i++){
    const a = (Math.PI*2) * (i/n) + rand(-0.06,0.06);
    const sp = rand(5.0, 15.5);
    sparks.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      g: 0.06,
      drag: 0.985,
      life: rand(80,160),
      hue: (hue + rand(-25,25) + 360) % 360,
      w: rand(1.8,3.6),
      alpha: 1
    });
  }
}

function drawFireworksBack(){
  b.save();
  b.globalCompositeOperation = "lighter";

  for(const r of rings){
    r.r += 12;
    r.alpha -= 0.012;
    b.beginPath();
    b.arc(r.x,r.y,r.r,0,Math.PI*2);
    b.strokeStyle = `hsla(${r.hue}, 100%, 72%, ${Math.max(0,r.alpha)})`;
    b.lineWidth = 10;
    b.shadowBlur = 26;
    b.shadowColor = `hsla(${r.hue}, 100%, 72%, ${Math.max(0,r.alpha)})`;
    b.stroke();
  }
  rings = rings.filter(r=>r.alpha>0 && r.r<r.max);

  for(const s of sparks){
    s.vx *= s.drag;
    s.vy *= s.drag;
    s.vy += s.g;
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 1;
    s.alpha = Math.max(0, s.life/160);

    b.beginPath();
    b.moveTo(s.x, s.y);
    b.lineTo(s.x - s.vx*2.2, s.y - s.vy*2.2);
    b.strokeStyle = `hsla(${s.hue}, 100%, 72%, ${s.alpha})`;
    b.lineWidth = s.w;
    b.shadowBlur = 22;
    b.shadowColor = `hsla(${s.hue}, 100%, 72%, ${s.alpha})`;
    b.stroke();

    b.fillStyle = `hsla(${(s.hue+10)%360}, 100%, 85%, ${s.alpha})`;
    b.beginPath(); b.arc(s.x, s.y, 2.2, 0, Math.PI*2); b.fill();
  }
  sparks = sparks.filter(s=>s.life>0);

  b.restore();
}

/* ===== LOOP ===== */
function animate(){
  b.clearRect(0,0,W,H);
  f.clearRect(0,0,W,H);

  // tension ramps during countdown
  if(countdownRunning) tension = Math.min(1, tension + 0.02);
  else tension = Math.max(0, tension - 0.04);

  // confetti on back canvas (but visible)
  for(const p of confetti){
    p.vy += p.g;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life -= 1;

    b.save();
    b.translate(p.x,p.y);
    b.rotate(p.rot);
    b.fillStyle = `hsla(${p.hue}, 95%, 60%, ${Math.max(0,p.life/170)})`;
    b.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6);
    b.restore();
  }
  confetti = confetti.filter(p=>p.life>0 && p.y < H+90);

  // fireworks on back
  drawFireworksBack();

  // CRUCIAL: dev kruvasan + fular on FRONT canvas (panelin üstünde)
  if(countdownRunning){
    drawRibbonsFront();
    drawCroissantsFront();
  }

  requestAnimationFrame(animate);
}
animate();

/* ===== FLOW ===== */
function clearAllFx(){
  confetti=[]; rings=[]; sparks=[]; ribbons=[]; croissants=[];
  if(salvoTimer){ clearInterval(salvoTimer); salvoTimer=null; }
}

function finalSalvos(){
  let shots = 0;
  const total = 6;     // kaç sefer arka arkaya
  const gapMs = 360;   // aralık

  // ilk “BAM!”
  launchFireworkBig(); launchFireworkBig(); launchFireworkBig();
  launchConfetti(W/2, H*0.28, 560);

  salvoTimer = setInterval(()=>{
    shots++;
    launchFireworkBig(); launchFireworkBig();
    launchConfetti(rand(W*0.15,W*0.85), rand(H*0.10,H*0.45), 220);

    if(shots >= total){
      clearInterval(salvoTimer);
      salvoTimer=null;
    }
  }, gapMs);
}

function startDraw(){
  const btn = document.getElementById("btn");
  btn.disabled = true;

  const likes=clean(likesBox.value);
  const comments=clean(commentsBox.value);
  const followers=clean(followersBox.value);
  const eligible=likes.filter(u=>comments.includes(u)&&followers.includes(u));

  clearAllFx();
  startCroissants();
  startRibbons();

  const cd=document.getElementById("countdown");
  const num=document.getElementById("countNum");
  cd.style.display="flex";

  countdownRunning = true;
  let c=5;
  num.textContent=c;

  const timer=setInterval(()=>{
    c--;
    num.textContent=c;

    if(c===0){
      clearInterval(timer);
      cd.style.display="none";
      countdownRunning = false;

      // kruvasanlar geri sayım bitince ekrandan gitsin (sadece final fişek kalsın)
      ribbons=[]; croissants=[];

      finalSalvos();

      result.style.display="block";
      winner.textContent = eligible.length
        ? "🎉 @" + eligible[Math.floor(Math.random()*eligible.length)] + " 🎉"
        : "😢 Uygun kimse yok";

      setTimeout(()=>{ btn.disabled = false; }, 1600);
    }
  },1000);
}

const likesBox=document.getElementById("likes");
const commentsBox=document.getElementById("comments");
const followersBox=document.getElementById("followers");
const result=document.getElementById("result");
const winner=document.getElementById("winner");
</script>

</body>
</html>
