<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Anlattugbacim – Kruvasan Fular Çekilişi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ===== BASE ===== */
body{
  margin:0;
  font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#fff7ed,#fef3c7);
  color:#4b2e2b;
  overflow:hidden;
}

/* ===== UI ===== */
.container{
  max-width:820px;
  margin:auto;
  padding:20px;
  position:relative;
  z-index:2;
}
.poster{
  background:#fff;
  border-radius:28px;
  padding:22px;
  border:6px dashed #fbbf24;
  box-shadow:0 25px 45px rgba(0,0,0,.15);
}
h1{
  font-family:'Baloo 2',cursive;
  text-align:center;
  font-size:32px;
  margin:0;
}
.subtitle{
  text-align:center;
  font-size:16px;
  margin-bottom:16px;
}
.section{
  background:#fff7ed;
  border-radius:20px;
  padding:14px;
  margin-bottom:10px;
}
label{
  font-weight:800;
  display:block;
  margin-bottom:6px;
}
textarea{
  width:100%;
  min-height:52px;
  border-radius:14px;
  border:2px solid #fde68a;
  padding:10px;
  font-size:14px;
}
button{
  width:100%;
  margin-top:14px;
  padding:14px;
  font-size:18px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#fb7185,#facc15);
  color:#4b2e2b;
  font-weight:900;
  cursor:pointer;
}
button:disabled{opacity:.6}
.result{
  margin-top:14px;
  background:#ecfeff;
  border-radius:20px;
  padding:14px;
  text-align:center;
  display:none;
}
.winner{
  font-family:'Baloo 2',cursive;
  font-size:24px;
  margin-top:6px;
}

/* ===== COUNTDOWN (DOKUNULMADI) ===== */
#countdown{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:20;
}
#countNum{
  font-family:'Baloo 2',cursive;
  font-size:140px;
  color:#fb7185;
  text-shadow:0 16px 50px rgba(0,0,0,.22);
  animation:pulse .55s infinite alternate;
}
@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.22)}
}

/* ===== CANVAS LAYERS ===== */
canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
}
#fxBack{z-index:6}   /* FİŞEK + KONFETİ (PANELİN ÜSTÜNDE) */
#fxFront{z-index:10} /* DEV KRUVA SAN + FULAR (EN ÖNDE) */

/* ===== MOBILE SCALE ===== */
@media (max-width: 430px){
  .container{padding:12px}
  .poster{padding:14px;border-width:5px}
  h1{font-size:28px}
  .subtitle{font-size:15px;margin-bottom:12px}
  button{font-size:17px;padding:13px}
  #countNum{font-size:130px}
}
</style>
</head>

<body>

<canvas id="fxBack"></canvas>
<canvas id="fxFront"></canvas>

<div class="container">
  <div class="poster">
    <h1>🧶🥐 Anlattugbacim</h1>
    <div class="subtitle">🎉 Kruvasan Fular Çekilişi 🎉</div>

    <div class="section">
      <label>❤️ Postu Beğenenler (virgülle)</label>
      <textarea id="likes"></textarea>
    </div>
    <div class="section">
      <label>💬 Yorum Yapanlar (virgülle)</label>
      <textarea id="comments"></textarea>
    </div>
    <div class="section">
      <label>⭐ Takip Edenler (virgülle)</label>
      <textarea id="followers"></textarea>
    </div>

    <button id="btn" onclick="startDraw()">🎪 Şans Çarkını Çevir 🎪</button>

    <div class="result" id="result">
      <div>🎊 Çekiliş Sonucu 🎊</div>
      <div class="winner" id="winner"></div>
    </div>
  </div>
</div>

<div id="countdown"><div id="countNum">5</div></div>

<script>
/* ===== UTIL ===== */
function clean(text){
  return [...new Set(
    text.toLowerCase().split(",")
      .map(x=>x.trim().replace(/^@/,""))
      .filter(x=>x.length>2)
  )];
}
function rand(min,max){return Math.random()*(max-min)+min}

/* ===== CANVAS SETUP ===== */
const back = document.getElementById("fxBack");
const b = back.getContext("2d");
const front = document.getElementById("fxFront");
const f = front.getContext("2d");

let W,H;
function resize(){
  W=back.width=front.width=window.innerWidth;
  H=back.height=front.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

/* ===== STATE ===== */
let confetti=[], rings=[], sparks=[];
let croissants=[];
let countdownRunning=false;
let salvoTimer=null;

/* ===== DEV KRUVA SANLAR (ÖN PLAN) ===== */
function startCroissants(){
  croissants=[];
  for(let i=0;i<12;i++){
    croissants.push({
      x:rand(0,W),
      y:rand(0,H),
      r:rand(80,220),
      a:rand(0,Math.PI*2),
      va:rand(-0.02,0.02),
      size:rand(140,240),
      bob:rand(20,50),
      t:rand(0,Math.PI*2)
    });
  }
}
function drawCroissants(){
  f.save();
  for(const c of croissants){
    c.a+=c.va;
    c.t+=0.05;
    const x=c.x+Math.cos(c.a)*c.r;
    const y=c.y+Math.sin(c.a)*c.r+Math.sin(c.t)*c.bob;
    const scale=0.9+0.2*Math.sin(c.t);
    f.translate(x,y);
    f.scale(scale,scale);
    f.font=`${c.size}px sans-serif`;
    f.shadowBlur=22;
    f.shadowColor="rgba(0,0,0,.2)";
    f.fillText("🥐",-c.size*0.3,c.size*0.3);
    f.setTransform(1,0,0,1,0,0);
  }
  f.restore();
}

/* ===== DEV FİŞEK ===== */
function launchFirework(){
  const x=rand(W*0.1,W*0.9);
  const y=rand(H*0.1,H*0.4);
  const hue=rand(0,360);
  rings.push({x,y,r:0,max:420,hue,alpha:1});
  for(let i=0;i<220;i++){
    const a=Math.random()*Math.PI*2;
    const sp=rand(5,14);
    sparks.push({
      x,y,
      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp,
      g:0.05,
      life:120,
      hue,
      w:rand(1.5,3)
    });
  }
}
function drawFireworks(){
  b.save();
  b.globalCompositeOperation="lighter";
  for(const r of rings){
    r.r+=12;
    r.alpha-=0.015;
    b.beginPath();
    b.arc(r.x,r.y,r.r,0,Math.PI*2);
    b.strokeStyle=`hsla(${r.hue},100%,70%,${r.alpha})`;
    b.lineWidth=10;
    b.shadowBlur=28;
    b.shadowColor=`hsla(${r.hue},100%,70%,${r.alpha})`;
    b.stroke();
  }
  rings=rings.filter(r=>r.alpha>0);

  for(const s of sparks){
    s.vy+=s.g;
    s.x+=s.vx;
    s.y+=s.vy;
    s.life--;
    b.beginPath();
    b.moveTo(s.x,s.y);
    b.lineTo(s.x-s.vx*2,s.y-s.vy*2);
    b.strokeStyle=`hsla(${s.hue},100%,70%,${s.life/120})`;
    b.lineWidth=s.w;
    b.stroke();
  }
  sparks=sparks.filter(s=>s.life>0);
  b.restore();
}

/* ===== LOOP ===== */
function animate(){
  b.clearRect(0,0,W,H);
  f.clearRect(0,0,W,H);
  drawFireworks();
  if(countdownRunning) drawCroissants();
  requestAnimationFrame(animate);
}
animate();

/* ===== FLOW ===== */
function startDraw(){
  const btn=document.getElementById("btn");
  btn.disabled=true;

  const likes=clean(likesBox.value);
  const comments=clean(commentsBox.value);
  const followers=clean(followersBox.value);
  const eligible=likes.filter(u=>comments.includes(u)&&followers.includes(u));

  startCroissants();

  const cd=document.getElementById("countdown");
  const num=document.getElementById("countNum");
  cd.style.display="flex";
  countdownRunning=true;

  let c=5;
  num.textContent=c;

  const timer=setInterval(()=>{
    c--;
    num.textContent=c;
    if(c===0){
      clearInterval(timer);
      cd.style.display="none";
      countdownRunning=false;
      croissants=[];

      let shots=0;
      salvoTimer=setInterval(()=>{
        launchFirework();
        shots++;
        if(shots>5) clearInterval(salvoTimer);
      },360);

      result.style.display="block";
      winner.textContent=eligible.length
        ? "🎉 @"+eligible[Math.floor(Math.random()*eligible.length)]+" 🎉"
        : "😢 Uygun kimse yok";

      setTimeout(()=>btn.disabled=false,1500);
    }
  },1000);
}

const likesBox=document.getElementById("likes");
const commentsBox=document.getElementById("comments");
const followersBox=document.getElementById("followers");
const result=document.getElementById("result");
const winner=document.getElementById("winner");
</script>

</body>
</html>
