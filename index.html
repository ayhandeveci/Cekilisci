<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Anlattugbacim – Kruvasan Fular Çekilişi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#fff7ed,#fef3c7);
  color:#4b2e2b;
  overflow-x:hidden;
}
.container{
  max-width:820px;
  margin:auto;
  padding:24px;
}
.poster{
  background:#fff;
  border-radius:30px;
  padding:26px;
  border:6px dashed #fbbf24;
  box-shadow:0 25px 45px rgba(0,0,0,.15);
}
h1{
  font-family:'Baloo 2',cursive;
  text-align:center;
  font-size:34px;
  margin:0;
}
.subtitle{
  text-align:center;
  font-size:18px;
  margin-bottom:22px;
}
.section{
  background:#fff7ed;
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
}
label{
  font-weight:800;
  display:block;
  margin-bottom:6px;
}
textarea{
  width:100%;
  min-height:70px;
  border-radius:16px;
  border:2px solid #fde68a;
  padding:12px;
  font-size:14px;
}
button{
  width:100%;
  margin-top:18px;
  padding:16px;
  font-size:20px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#fb7185,#facc15);
  color:#4b2e2b;
  font-weight:900;
  cursor:pointer;
}
.result{
  margin-top:18px;
  background:#ecfeff;
  border-radius:24px;
  padding:18px;
  text-align:center;
  display:none;
}
.winner{
  font-family:'Baloo 2',cursive;
  font-size:28px;
  margin-top:8px;
}

/* COUNTDOWN – ŞEFFAF */
#countdown{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:999;
}
#countNum{
  font-family:'Baloo 2',cursive;
  font-size:140px;
  color:#fb7185;
  text-shadow:0 10px 30px rgba(0,0,0,.15);
  animation:pulse .6s infinite alternate;
}
@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.18)}
}

/* MOTİFLER */
.motif{
  position:fixed;
  z-index:500;
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  0%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(25px,-35px) rotate(180deg)}
  100%{transform:translate(-25px,25px) rotate(360deg)}
}

/* ATLI KARINCA */
.carousel{
  position:fixed;
  font-size:42px;
  z-index:400;
  animation:spin 3s linear infinite;
}
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* KONFETİ */
.confetti{
  position:fixed;
  width:8px;
  height:14px;
  background:red;
  z-index:900;
  animation:confettiFall 2.5s ease-out forwards;
}
@keyframes confettiFall{
  from{transform:translateY(0) rotate(0deg);opacity:1}
  to{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* FİŞEK */
.firework{
  position:fixed;
  font-size:32px;
  z-index:950;
  animation:boom 1.2s ease-out forwards;
}
@keyframes boom{
  from{transform:scale(.2);opacity:1}
  to{transform:scale(2.5);opacity:0}
}
</style>
</head>

<body>

<div class="container">
  <div class="poster">
    <h1>🧶🥐 Anlattugbacim</h1>
    <div class="subtitle">🎉 Kruvasan Fular Çekilişi 🎉</div>

    <div class="section">
      <label>❤️ Postu Beğenenler</label>
      <textarea id="likes"></textarea>
    </div>

    <div class="section">
      <label>💬 Yorum Yapanlar</label>
      <textarea id="comments"></textarea>
    </div>

    <div class="section">
      <label>⭐ Hesabı Takip Edenler</label>
      <textarea id="followers"></textarea>
    </div>

    <button onclick="startDraw()">🎪 Şans Çarkını Çevir 🎪</button>

    <div class="result" id="result">
      <div>🎊 Çekiliş Sonucu 🎊</div>
      <div class="winner" id="winner"></div>
    </div>
  </div>
</div>

<div id="countdown">
  <div id="countNum">5</div>
</div>

<script>
function clean(text){
  return [...new Set(
    text.toLowerCase().split(",")
      .map(x=>x.trim().replace(/^@/,""))
      .filter(x=>x.length>2)
  )];
}

function spawnMotifs(){
  const icons=["🐥","🐦","🎈","✨","🐣","🎀"];
  for(let i=0;i<25;i++){
    const m=document.createElement("div");
    m.className="motif";
    m.textContent=icons[Math.floor(Math.random()*icons.length)];
    m.style.left=Math.random()*100+"vw";
    m.style.top=Math.random()*100+"vh";
    m.style.fontSize=(16+Math.random()*40)+"px";
    document.body.appendChild(m);
  }
}

function spawnCarousels(){
  for(let i=0;i<3;i++){
    const c=document.createElement("div");
    c.className="carousel";
    c.textContent="🎠";
    c.style.left=Math.random()*80+"vw";
    c.style.top=Math.random()*80+"vh";
    document.body.appendChild(c);
  }
}

function clearDecor(){
  document.querySelectorAll(".motif,.carousel").forEach(e=>e.remove());
}

function fireworks(){
  for(let i=0;i<8;i++){
    const f=document.createElement("div");
    f.className="firework";
    f.textContent="🎆";
    f.style.left=(20+Math.random()*60)+"vw";
    f.style.top=(20+Math.random()*40)+"vh";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1200);
  }
}

function confetti(){
  const colors=["#fb7185","#facc15","#38bdf8","#4ade80"];
  for(let i=0;i<80;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2500);
  }
}

function startDraw(){
  const likes=clean(likesBox.value);
  const comments=clean(commentsBox.value);
  const followers=clean(followersBox.value);
  const eligible=likes.filter(u=>comments.includes(u)&&followers.includes(u));

  const cd=document.getElementById("countdown");
  const num=document.getElementById("countNum");
  cd.style.display="flex";

  spawnMotifs();
  spawnCarousels();

  let c=5;
  num.textContent=c;

  const timer=setInterval(()=>{
    c--;
    num.textContent=c;

    if(c===0){
      clearInterval(timer);
      cd.style.display="none";
      clearDecor();
      fireworks();
      confetti();

      result.style.display="block";
      winner.textContent = eligible.length
        ? "🎉 @" + eligible[Math.floor(Math.random()*eligible.length)] + " 🎉"
        : "😢 Uygun kimse yok";
    }
  },1000);
}

const likesBox=document.getElementById("likes");
const commentsBox=document.getElementById("comments");
const followersBox=document.getElementById("followers");
const result=document.getElementById("result");
const winner=document.getElementById("winner");
</script>

</body>
</html>
